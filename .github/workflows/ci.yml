name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  desktop-windows:
    # A main push is covered by `release-windows`; skip the slow Windows debug job there.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy -p postbox-app --features desktop -- -D warnings
      - run: cargo test -p postbox-ui --features desktop-test

  release-windows:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve release version and tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF.StartsWith("refs/tags/v")) {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag.TrimStart('v')
          } else {
            $version = "0.1.$($env:GITHUB_RUN_NUMBER)"
            $tag = "v$version"
          }
          "POSTBOX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release -p postbox-app --features desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release -p postbox-ctl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows bundle and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "dist/postbox-windows-x64"
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "target/release/postbox.exe" "$stage/postbox.exe"
          Copy-Item "target/release/postboxctl.exe" "$stage/postboxctl.exe"
          Copy-Item "assets/IBMPlex*.ttf" "$stage/"
          Copy-Item "assets/IBM-Plex-LICENSE.txt" "$stage/IBM-Plex-LICENSE.txt"

          $required = @(
            "postbox.exe",
            "postboxctl.exe",
            "IBMPlexSans-Regular.ttf",
            "IBMPlexSans-Medium.ttf",
            "IBMPlexSans-SemiBold.ttf",
            "IBMPlexSans-Bold.ttf",
            "IBMPlexSans-Italic.ttf",
            "IBMPlexMono-Regular.ttf",
            "IBM-Plex-LICENSE.txt"
          )
          foreach ($file in $required) {
            if (-not (Test-Path "$stage/$file")) {
              throw "Missing required bundle file: $file"
            }
          }

          $zipPath = "dist/postbox-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force

          $hash = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToLowerInvariant()
          $size = (Get-Item $zipPath).Length
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "dist/SHA256SUMS.txt"),
            "$hash  postbox-windows-x64.zip`n",
            (New-Object System.Text.UTF8Encoding($false))
          )

          $tag = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          $repo = $env:GITHUB_REPOSITORY
          $update = [ordered]@{
            version  = $version
            tag      = $tag
            tag_name = $tag
            asset    = "postbox-windows-x64.zip"
            sha256   = $hash
            size     = $size
            body     = ""
            assets   = @(
              [ordered]@{
                name                 = "postbox-windows-x64.zip"
                browser_download_url = "https://github.com/$repo/releases/download/$tag/postbox-windows-x64.zip"
                size                 = $size
                digest               = "sha256:$hash"
              }
            )
          }
          $json = ($update | ConvertTo-Json -Depth 4) + "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "dist/update.json"),
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )
      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: postbox-windows-x64
          path: |
            dist/postbox-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/update.json
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $repo = $env:GITHUB_REPOSITORY
          $assets = @(
            "dist/postbox-windows-x64.zip",
            "dist/SHA256SUMS.txt",
            "dist/update.json"
          )

          $ErrorActionPreference = 'Continue'
          gh release view $tag --repo $repo 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'

          if ($exists) {
            gh release upload $tag @assets --repo $repo --clobber
          } else {
            gh release create $tag @assets --repo $repo --target $env:GITHUB_SHA --title "Postbox $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
