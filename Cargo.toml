[workspace]
resolver = "3"
members = [
    "crates/postbox-core",
    "crates/postbox-hub",
    "crates/postbox-store",
    "crates/postbox-keymap",
    "crates/postbox-platform",
    "crates/postbox-ui",
    "crates/postbox-app",
    "crates/postbox-ctl",
    "crates/postbox-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
postbox-core = { path = "crates/postbox-core" }
postbox-store = { path = "crates/postbox-store" }
postbox-keymap = { path = "crates/postbox-keymap" }
postbox-ui = { path = "crates/postbox-ui" }

gpui-kit = { version = "0.11.0", default-features = false, features = ["component", "assets"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
