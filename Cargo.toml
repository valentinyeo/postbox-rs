[workspace]
resolver = "3"
members = [
    "crates/postbox-core",
    "crates/postbox-hub",
    "crates/postbox-store",
    "crates/postbox-keymap",
    "crates/postbox-platform",
    "crates/postbox-media",
    "crates/postbox-ui",
    "crates/postbox-app",
    "crates/postbox-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
postbox-core = { path = "crates/postbox-core" }
postbox-hub = { path = "crates/postbox-hub" }
postbox-store = { path = "crates/postbox-store" }
postbox-keymap = { path = "crates/postbox-keymap" }
postbox-platform = { path = "crates/postbox-platform" }
postbox-media = { path = "crates/postbox-media" }
postbox-ui = { path = "crates/postbox-ui" }

async-channel = "2.5.0"
bytes = "1.12.2"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.3.4"
gpui-kit = { version = "0.11.0", default-features = false, features = ["component", "assets"] }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "ico",
] }
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
    "http2",
    "stream",
    "system-proxy",
] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
smallvec = "1.16.6"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "rt",
    "net",
    "time",
    "sync",
    "macros",
    "io-util",
] }
url = "2.5.9"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
