[workspace]
resolver = "3"
members = [
    "crates/postbox-core",
    "crates/postbox-hub",
    "crates/postbox-store",
    "crates/postbox-keymap",
    "crates/postbox-platform",
    "crates/postbox-media",
    "crates/postbox-audio",
    "crates/postbox-ui",
    "crates/postbox-app",
    "crates/postbox-ctl",
    "crates/postbox-e2e",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
postbox-core = { path = "crates/postbox-core" }
postbox-hub = { path = "crates/postbox-hub" }
postbox-store = { path = "crates/postbox-store" }
postbox-keymap = { path = "crates/postbox-keymap" }
postbox-platform = { path = "crates/postbox-platform" }
postbox-media = { path = "crates/postbox-media" }
postbox-audio = { path = "crates/postbox-audio" }
postbox-ui = { path = "crates/postbox-ui" }

async-channel = "2.5.0"
bytes = "1.12.2"
opus-pure = "0.2.5"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.3.4"
gpui-kit = { version = "0.11.0", default-features = false, features = ["component", "assets"] }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "ico",
] }
reqwest = { version = "0.12.28", default-features = false, features = [
    "blocking",
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
    "http2",
    "stream",
    "system-proxy",
] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
smallvec = "1.16.6"
crc32fast = "1.5.6"
miniz_oxide = "0.9.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "rt",
    "net",
    "time",
    "sync",
    "macros",
    "io-util",
] }
tokio-tungstenite = { version = "0.30.0", features = [
    "rustls-tls-webpki-roots",
    "rustls-tls-native-roots",
] }
url = "2.5.9"
webpki-roots = "1.0.12"
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
